name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore HelpDesk.sln
      - name: Build
        run: dotnet build HelpDesk.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test HelpDesk.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
